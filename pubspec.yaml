version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^3.5.5
  screenshot: ^2.1.0
